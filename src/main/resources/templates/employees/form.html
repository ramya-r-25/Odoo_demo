<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dayflow HRMS - Edit Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0" th:text="${isHrAdmin ? 'Edit Employee (HR Admin)' : 'Edit My Profile'}">Edit Profile</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">

                <!-- Administrative Fields (HR_ADMIN only or Read-Only for EMPLOYEE) -->
                <div class="mb-3">
                    <label class="form-label">Employee ID</label>
                    <input type="text" class="form-control" th:field="*{employeeId}" th:readonly="${!isHrAdmin}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}" th:readonly="${!isHrAdmin}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" th:readonly="${!isHrAdmin}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Job Position</label>
                    <input type="text" class="form-control" th:field="*{jobPosition}" th:readonly="${!isHrAdmin}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text" class="form-control" th:field="*{department}" th:readonly="${!isHrAdmin}">
                </div>

                <!-- Salary (HR_ADMIN editable, EMPLOYEE non-editable) -->
                <div class="mb-3" th:if="${isHrAdmin}">
                    <label class="form-label">Salary</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{salary}">
                </div>

                <!-- Employee Self-Editable Fields -->
                <hr>
                <h6 class="text-primary">Contact & Profile Settings (Editable)</h6>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" th:field="*{phone}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" th:field="*{address}" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Profile Picture URL</label>
                    <input type="text" class="form-control" th:field="*{profilePicture}">
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/employees" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
