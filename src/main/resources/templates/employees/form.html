<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - Edit Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-dark: #191D23;
            --dark-blue-gray: #57707A;
            --muted-blue-gray: #7E919F;
            --soft-gray-lavender: #979DAB;
            --soft-lavender: #C5BAC4;
            --light-gray: #DEDEDC;
            --card-bg: #F2F1F1;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--light-gray); color: var(--primary-dark); min-height: 100vh; }

        .sidebar {
            width: 260px; background-color: var(--primary-dark); color: var(--light-gray);
            position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; padding: 1.5rem 1rem;
            display: flex; flex-direction: column; box-shadow: 4px 0 20px rgba(0,0,0,0.08);
        }

        .sidebar-brand {
            font-weight: 800; font-size: 1.3rem; color: var(--light-gray); letter-spacing: -0.5px;
            display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem; margin-bottom: 2rem; text-decoration: none;
        }

        .sidebar-brand-icon {
            background-color: var(--dark-blue-gray); color: var(--light-gray);
            width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
        }

        .nav-item-link {
            display: flex; align-items: center; gap: 0.85rem; padding: 0.75rem 1rem;
            color: var(--light-gray); text-decoration: none; font-size: 0.92rem; font-weight: 500;
            border-radius: 12px; margin-bottom: 0.35rem; transition: all 0.2s ease;
        }

        .nav-item-link:hover { background-color: var(--muted-blue-gray); color: var(--light-gray); }
        .nav-item-link.active { background-color: var(--dark-blue-gray); color: var(--light-gray); font-weight: 600; }
        .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(222, 222, 220, 0.15); }

        .main-wrapper { margin-left: 260px; min-height: 100vh; display: flex; flex-direction: column; }
        .top-navbar { background-color: var(--card-bg); border-bottom: 1px solid var(--soft-lavender); padding: 0.9rem 2rem; display: flex; align-items: center; justify-content: space-between; }

        .theme-card {
            background-color: var(--card-bg);
            border: 1px solid var(--soft-lavender);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .form-control, .form-select {
            background-color: var(--card-bg);
            border: 1px solid var(--soft-lavender);
            color: var(--primary-dark);
            border-radius: 12px;
            padding: 0.65rem 1rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: var(--dark-blue-gray);
            box-shadow: 0 0 0 0.2rem rgba(87, 112, 122, 0.2);
            color: var(--primary-dark);
        }

        .form-control[readonly] {
            background-color: var(--light-gray);
            border-color: var(--soft-lavender);
            color: var(--dark-blue-gray);
            cursor: not-allowed;
        }

        .form-label {
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.88rem;
        }

        .btn-theme-primary {
            background-color: var(--primary-dark); color: var(--light-gray); border: none;
            border-radius: 12px; padding: 0.65rem 1.4rem; font-weight: 600; text-decoration: none; transition: all 0.2s ease;
        }
        .btn-theme-primary:hover { background-color: var(--dark-blue-gray); color: var(--light-gray); }

        .btn-theme-secondary {
            background-color: var(--soft-lavender); color: var(--primary-dark); border: none;
            border-radius: 12px; padding: 0.65rem 1.4rem; font-weight: 600; text-decoration: none; transition: all 0.2s ease;
        }
        .btn-theme-secondary:hover { background-color: var(--soft-gray-lavender); color: var(--primary-dark); }

        @media (max-width: 991.98px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-wrapper { margin-left: 0; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="/dashboard" class="sidebar-brand">
        <div class="sidebar-brand-icon"><i class="bi bi-layers-fill"></i></div>
        <span>Dayflow</span>
    </a>
    <nav class="w-100">
        <a href="/dashboard" class="nav-item-link"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a th:if="${isHrAdmin}" href="/employees" class="nav-item-link active"><i class="bi bi-people-fill"></i> Employees</a>
        <a th:if="${!isHrAdmin}" href="/employees/me" class="nav-item-link active"><i class="bi bi-person-circle"></i> My Profile</a>
        <a href="/attendance" class="nav-item-link"><i class="bi bi-clock-history"></i> Attendance</a>
        <a href="/leave" class="nav-item-link"><i class="bi bi-calendar2-check-fill"></i> Leave</a>
        <a th:if="${isHrAdmin}" href="/payroll" class="nav-item-link"><i class="bi bi-cash-stack"></i> Payroll / Salary</a>
        <a th:if="${isHrAdmin}" href="/reports" class="nav-item-link"><i class="bi bi-bar-chart-line-fill"></i> Reports</a>
    </nav>
    <div class="sidebar-footer w-100">
        <a href="/logout" class="nav-item-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</aside>

<div class="main-wrapper">
    <header class="top-navbar">
        <h5 class="fw-bold mb-0" style="color: var(--primary-dark);" th:text="${isHrAdmin ? 'Edit Employee Record' : 'Edit Contact Profile'}">Edit Profile</h5>
        <div class="d-flex align-items-center gap-3">
            <span class="badge px-3 py-2" style="background-color: var(--dark-blue-gray); color: var(--light-gray); border-radius: 20px;"
                  th:text="${isHrAdmin ? 'HR Full Access' : 'Restricted Edit'}">Rights</span>
        </div>
    </header>

    <main class="p-4 p-lg-5">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                <div class="theme-card">
                    <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
                        
                        <!-- Administrative Section -->
                        <h6 class="fw-bold mb-3" style="color: var(--dark-blue-gray); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px;">
                            <i class="bi bi-shield-lock me-1"></i>Administrative Fields
                        </h6>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Employee ID</label>
                                <input type="text" class="form-control" th:field="*{employeeId}" th:readonly="${!isHrAdmin}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" th:field="*{fullName}" th:readonly="${!isHrAdmin}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" th:field="*{email}" th:readonly="${!isHrAdmin}" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Job Position</label>
                                <input type="text" class="form-control" th:field="*{jobPosition}" th:readonly="${!isHrAdmin}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Department</label>
                                <input type="text" class="form-control" th:field="*{department}" th:readonly="${!isHrAdmin}">
                            </div>
                        </div>

                        <div class="mb-3" th:if="${isHrAdmin}">
                            <label class="form-label fw-bold" style="color: var(--primary-dark);">Salary ($)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{salary}">
                        </div>

                        <div class="p-3 rounded mb-4" style="background-color: var(--light-gray); border: 1px solid var(--soft-lavender);" th:if="${!isHrAdmin}">
                            <span class="small" style="color: var(--dark-blue-gray);"><i class="bi bi-info-circle me-1"></i>Employee ID, Full Name, Email, Job Position, Department, and Salary are managed exclusively by HR Admin.</span>
                        </div>

                        <!-- Editable Contact Section -->
                        <hr style="border-color: var(--soft-lavender);" class="my-4">
                        <h6 class="fw-bold mb-3" style="color: var(--dark-blue-gray); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px;">
                            <i class="bi bi-person-gear me-1"></i>Editable Contact Details
                        </h6>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" class="form-control" th:field="*{phone}" placeholder="+1-555-0192">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Residential Address</label>
                            <textarea class="form-control" th:field="*{address}" rows="3" placeholder="Enter address"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Profile Picture Reference</label>
                            <input type="text" class="form-control" th:field="*{profilePicture}" placeholder="avatar.png">
                        </div>

                        <div class="d-flex justify-content-between gap-2 mt-4">
                            <a th:href="@{/employees/{id}(id=${employee.id})}" class="btn-theme-secondary">Cancel</a>
                            <button type="submit" class="btn-theme-primary"><i class="bi bi-check2-circle me-1"></i>Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
