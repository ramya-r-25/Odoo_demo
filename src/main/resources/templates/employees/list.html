<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dayflow HRMS - Employee List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- Navbar Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">Dayflow HRMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/employees">Employee List</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/attendance">Attendance</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/leave/approvals">Leave Approvals</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/payroll">Payroll</a>
                </li>
            </ul>
            <span class="badge bg-danger me-3">HR_ADMIN</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Employee Directory</h2>
        <a href="/employees/new" class="btn btn-primary">+ Create Employee</a>
    </div>

    <table class="table table-striped table-bordered bg-white shadow-sm align-middle">
        <thead class="table-dark">
        <tr>
            <th>Employee ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Job Position</th>
            <th>Department</th>
            <th>Salary (HR Admin)</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td class="fw-bold" th:text="${emp.employeeId}">EMP-001</td>
            <td th:text="${emp.fullName}">Alex Morgan</td>
            <td th:text="${emp.email}">alex@dayflow.com</td>
            <td th:text="${emp.jobPosition}">Software Engineer</td>
            <td th:text="${emp.department}">Engineering</td>
            <td class="text-success fw-bold" th:text="${#numbers.formatCurrency(emp.salary)}">$85,000.00</td>
            <td>
                <a th:href="@{/employees/{id}(id=${emp.id})}" class="btn btn-sm btn-info text-white">View</a>
                <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-sm btn-warning">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
