<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dayflow HRMS - Leave Approvals</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">Dayflow HRMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/employees">Employee List</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/attendance">Attendance</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/leave/approvals">Leave Approvals</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/payroll">Payroll</a>
                </li>
            </ul>
            <span class="badge bg-danger me-3" th:text="${currentUserRole}">HR_ADMIN</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Manage Employee Leave Requests</h5>
        </div>
        <div class="card-body">
            <!-- Notifications -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Leave Type</th>
                        <th>Date Range</th>
                        <th>Duration (Days)</th>
                        <th>Remarks</th>
                        <th>Status</th>
                        <th>HR Comment</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="leave : ${leaves}">
                        <td th:text="${leave.employee.fullName}">John Doe</td>
                        <td th:text="${leave.leaveType}">PAID</td>
                        <td th:text="${leave.startDate + ' to ' + leave.endDate}">2026-08-23 to 2026-08-25</td>
                        <td th:text="${leave.getDurationDays()}">3</td>
                        <td th:text="${leave.remarks}">Vacation</td>
                        <td>
                            <span class="badge" th:classappend="${leave.status.name() == 'APPROVED' ? 'bg-success' : (leave.status.name() == 'REJECTED' ? 'bg-danger' : 'bg-warning')}" th:text="${leave.status}">PENDING</span>
                        </td>
                        <td>
                            <form th:id="'comment-form-' + ${leave.id}" method="post" class="d-flex align-items-center">
                                <input type="text" th:name="hrComment" th:id="'hrComment-' + ${leave.id}" th:value="${leave.hrComment}" class="form-control form-control-sm" placeholder="Add HR comment" th:disabled="${leave.status.name() != 'PENDING'}">
                            </form>
                        </td>
                        <td>
                            <div th:if="${leave.status.name() == 'PENDING'}" class="d-flex gap-2">
                                <button type="button" class="btn btn-success btn-sm" th:onclick="'submitApproval(' + ${leave.id} + ', true)'">Approve</button>
                                <button type="button" class="btn btn-danger btn-sm" th:onclick="'submitApproval(' + ${leave.id} + ', false)'">Reject</button>
                            </div>
                            <span th:if="${leave.status.name() != 'PENDING'}" class="text-muted small">Closed</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(leaves)}">
                        <td colspan="8" class="text-center text-muted">No leave requests found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function submitApproval(id, approve) {
        const form = document.getElementById('comment-form-' + id);
        const commentInput = document.getElementById('hrComment-' + id);
        const action = approve ? '/leave/approve/' + id : '/leave/reject/' + id;
        
        form.action = action;
        
        // Ensure the input field has its value set before submission
        const hiddenComment = document.createElement('input');
        hiddenComment.type = 'hidden';
        hiddenComment.name = 'hrComment';
        hiddenComment.value = commentInput.value;
        form.appendChild(hiddenComment);
        
        form.submit();
    }
</script>
</body>
</html>
