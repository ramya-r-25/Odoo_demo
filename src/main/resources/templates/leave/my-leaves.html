<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dayflow HRMS - My Leaves</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">Dayflow HRMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/employees/profile">My Profile</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/attendance">Attendance</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/leave">Leave Requests</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="/payroll">My Salary</a>
                </li>
            </ul>
            <span class="badge bg-secondary me-3" th:text="${currentUserRole}">EMPLOYEE</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <!-- Leave Application Form -->
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Apply for Leave</h5>
                </div>
                <div class="card-body">
                    <!-- Notifications -->
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/leave/submit}" th:object="${leaveRequest}" method="post">
                        <div class="mb-3">
                            <label for="leaveType" class="form-label">Leave Type</label>
                            <select id="leaveType" th:field="*{leaveType}" class="form-select" required>
                                <option value="PAID">PAID</option>
                                <option value="SICK">SICK</option>
                                <option value="UNPAID">UNPAID</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="startDate" class="form-label">Start Date</label>
                            <input type="date" id="startDate" th:field="*{startDate}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="endDate" class="form-label">End Date</label>
                            <input type="date" id="endDate" th:field="*{endDate}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="remarks" class="form-label">Remarks</label>
                            <textarea id="remarks" th:field="*{remarks}" class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Own Leave Requests List -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">My Leave History</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                            <tr>
                                <th>Leave Type</th>
                                <th>Start Date</th>
                                <th>End Date</th>
                                <th>Duration (Days)</th>
                                <th>Status</th>
                                <th>HR Comment</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="leave : ${leaves}">
                                <td th:text="${leave.leaveType}">PAID</td>
                                <td th:text="${leave.startDate}">2026-08-23</td>
                                <td th:text="${leave.endDate}">2026-08-25</td>
                                <td th:text="${leave.getDurationDays()}">3</td>
                                <td>
                                    <span class="badge" th:classappend="${leave.status.name() == 'APPROVED' ? 'bg-success' : (leave.status.name() == 'REJECTED' ? 'bg-danger' : 'bg-warning')}" th:text="${leave.status}">PENDING</span>
                                </td>
                                <td th:text="${leave.hrComment != null ? leave.hrComment : '-'}">-</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(leaves)}">
                                <td colspan="6" class="text-center text-muted">No leave requests found.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
