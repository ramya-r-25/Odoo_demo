<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-dark: #191D23;
            --dark-blue-gray: #57707A;
            --muted-blue-gray: #7E919F;
            --soft-gray-lavender: #979DAB;
            --soft-lavender: #C5BAC4;
            --light-gray: #DEDEDC;
            --card-bg: #F2F1F1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-dark);
            color: var(--primary-dark);
            min-height: 100vh;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--soft-lavender);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .brand-icon {
            background-color: var(--primary-dark);
            color: var(--light-gray);
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .brand-title {
            color: var(--primary-dark);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .form-control {
            background-color: #ffffff;
            border: 1px solid var(--soft-lavender);
            color: var(--primary-dark);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--dark-blue-gray);
            box-shadow: 0 0 0 0.2rem rgba(87, 112, 122, 0.2);
            color: var(--primary-dark);
        }

        .form-control::placeholder {
            color: var(--muted-blue-gray);
        }

        .input-group-text {
            background-color: var(--soft-lavender);
            border: 1px solid var(--soft-lavender);
            color: var(--primary-dark);
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .btn-primary-theme {
            background-color: var(--primary-dark);
            color: var(--light-gray);
            border: none;
            border-radius: 12px;
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(25, 29, 35, 0.2);
            transition: all 0.2s ease;
        }

        .btn-primary-theme:hover {
            background-color: var(--dark-blue-gray);
            color: var(--light-gray);
        }

        .demo-pill {
            background-color: var(--soft-lavender);
            color: var(--primary-dark);
            border-radius: 20px;
            padding: 0.4rem 0.85rem;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
        }

        .demo-pill:hover {
            background-color: var(--dark-blue-gray);
            color: var(--light-gray);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card login-card p-4 p-sm-5">
                
                <!-- Brand Header -->
                <div class="text-center mb-4">
                    <div class="brand-icon mb-3">
                        <i class="bi bi-layers-fill"></i>
                    </div>
                    <h3 class="brand-title mb-1">Dayflow HRMS</h3>
                    <p style="color: var(--dark-blue-gray);" class="small mb-0">Human Resource Management System</p>
                </div>

                <!-- Conditional Alerts (Only show when URL param is present) -->
                <div class="alert py-2 small mb-3 border-0" style="background-color: var(--soft-lavender); color: var(--primary-dark);" th:if="${param.error != null}" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid credentials. Please try again.
                </div>
                <div class="alert py-2 small mb-3 border-0" style="background-color: var(--soft-gray-lavender); color: var(--primary-dark);" th:if="${param.logout != null}" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>You have been logged out.
                </div>

                <!-- Form -->
                <form th:action="@{/dashboard}" action="dashboard.html" method="get">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small" style="color: var(--primary-dark);">Username / Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" id="usernameInput" name="username" class="form-control" placeholder="user@dayflow.com" value="alex.morgan@dayflow.com" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small" style="color: var(--primary-dark);">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="passwordInput" name="password" class="form-control" placeholder="••••••••" value="pass123" required>
                        </div>
                    </div>
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary-theme">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </div>
                </form>

                <!-- Quick Demo Access -->
                <div class="p-3 rounded text-center" style="background-color: var(--light-gray); border: 1px solid var(--soft-lavender);">
                    <span class="small fw-semibold d-block mb-2" style="color: var(--dark-blue-gray);">Quick Demo Access</span>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <span class="demo-pill" onclick="setDemo('employee@dayflow.com', 'employee123')">
                            <i class="bi bi-person me-1"></i>Employee
                        </span>
                        <span class="demo-pill" onclick="setDemo('admin@dayflow.com', 'admin123')">
                            <i class="bi bi-shield-check me-1"></i>HR Admin
                        </span>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <small style="color: var(--muted-blue-gray); font-size: 0.75rem;">
                        <i class="bi bi-shield-lock me-1"></i>Dayflow HRMS • Unified SaaS Platform
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function setDemo(email, password) {
        document.getElementById('usernameInput').value = email;
        document.getElementById('passwordInput').value = password;
    }
</script>
</body>
</html>
